<!DOCTYPE html>
<html lang="fr" data-track="elsewhere">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OBSIDIA / FUTURE AUDIO</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;min-height:76px;margin:0;background:transparent;font-family:Inter,'Segoe UI',Arial,sans-serif;overflow:hidden}
#deck{--violet:#a770ff;--pink:#ff56b9;--cyan:#62e5ff;position:relative;isolation:isolate;width:100%;max-width:400px;height:76px;color:#f9eeff;overflow:hidden;border-radius:9px;background:linear-gradient(118deg,#0a0c20,#181029 54%,#080d1d);border:1px solid #6c4595;box-shadow:inset 0 0 12px #ad4eff35,0 0 0 1px #100f26}
#deck:before{content:"";position:absolute;inset:-45%;z-index:-1;background:conic-gradient(from 0deg at 50% 50%,#691be200,#e9379718 18%,#38d2ff1e 29%,#783ae500 42%,#d334951b 57%,#3c8cfb1b 74%,#691be200 92%);animation:spin 12s linear infinite}
#deck:after{content:"";pointer-events:none;position:absolute;inset:0;z-index:8;border-radius:9px;box-shadow:inset 0 0 0 1px #d782ff2f,inset 0 0 14px #af38e72f}
@keyframes spin{to{transform:rotate(360deg)}}
.edge{position:absolute;z-index:9;pointer-events:none;height:2px;left:12px;right:12px;top:0;background:linear-gradient(90deg,transparent,#ff56b9,#7ed6ff,#b55dff,transparent);background-size:180% 100%;animation:edgeflow 4s linear infinite;box-shadow:0 0 6px #e54bff,0 0 11px #8658ff}
.edge.bottom-edge{top:auto;bottom:0;left:20px;right:20px;opacity:.72;animation-direction:reverse}
@keyframes edgeflow{0%{background-position:150% 0}100%{background-position:-120% 0}}
/* Holographic portraits: image-based, never old SVG sprites */
.scene{position:absolute;inset:2px 4px 33px;overflow:hidden;border-radius:5px 5px 0 0;background:repeating-linear-gradient(90deg,transparent 0 21px,#ba49dd09 21px 22px),linear-gradient(180deg,#19132c7d,#09102435)}
.scene:before{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(0deg,#110b29dd,transparent);z-index:6;pointer-events:none}
.city{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 13px,#df4bba14 13px 15px,transparent 15px 32px,#4cbaef16 32px 34px);opacity:.7;mask-image:linear-gradient(0deg,#000,transparent);pointer-events:none}
.portraits{position:absolute;top:-6px;bottom:-3px;left:50%;width:275px;transform:translateX(-50%);display:flex;justify-content:center;align-items:flex-end;gap:2px;z-index:3;pointer-events:none}
.character{position:relative;width:50px;height:45px;overflow:hidden;flex:none;clip-path:polygon(10% 0,90% 0,100% 16%,100% 100%,0 100%,0 16%);background:#151126;transform-origin:center bottom;animation:levitate 3.3s ease-in-out infinite;filter:drop-shadow(0 0 3px #aa5aff)}
.character img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 19%;filter:saturate(1.17) contrast(1.06)}
.character:after{content:"";position:absolute;inset:0;border:1px solid #d485ff72;box-shadow:inset 0 0 8px #7d38dd70;pointer-events:none}
.character:nth-child(1){width:44px;height:36px;opacity:.91;animation-delay:-.4s}
.character:nth-child(2){height:41px;animation-delay:-1.3s}
.character:nth-child(3){width:60px;height:49px;z-index:2;clip-path:polygon(10% 0,90% 0,100% 14%,100% 100%,0 100%,0 14%);filter:drop-shadow(0 0 6px #b56eff)}
.character:nth-child(3):after{border-color:#b9b4ff;box-shadow:inset 0 0 12px #665dff88}
.character:nth-child(4){height:41px;animation-delay:-2s}
.character:nth-child(5){width:44px;height:36px;opacity:.92;animation-delay:-.9s}
@keyframes levitate{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.3px)}}
.hud-left,.hud-right{position:absolute;z-index:4;top:7px;font-size:6px;font-weight:750;letter-spacing:1.3px;color:#9be8ff;opacity:.75;text-shadow:0 0 5px #62e5ff;pointer-events:none}
.hud-left{left:8px}.hud-right{right:8px;text-align:right;color:#edabff;text-shadow:0 0 5px #fb69ff}
.hud-left i,.hud-right i{display:block;height:1px;width:33px;background:linear-gradient(90deg,#44dcff,transparent);margin-top:4px;box-shadow:0 0 6px #31deff}
.hud-right i{margin-left:auto;background:linear-gradient(270deg,#ff5fcc,transparent);box-shadow:0 0 6px #ff5fcc}
.beam{position:absolute;z-index:5;pointer-events:none;top:-4px;left:-35%;width:30%;height:42px;transform:skewX(-25deg);background:linear-gradient(90deg,transparent,#ff5ac018,#7cc6ff24,transparent);animation:scan 5.3s ease-in-out infinite}
@keyframes scan{0%{left:-30%}100%{left:130%}}
.wave{position:absolute;z-index:6;bottom:2px;left:50%;transform:translateX(-50%);height:7px;display:flex;align-items:end;gap:2px;opacity:.72}
.wave b{width:2px;height:2px;background:#ff87de;box-shadow:0 0 5px #ff56cf;border-radius:2px;animation:wave .65s ease-in-out infinite alternate;animation-play-state:paused}
.wave b:nth-child(2n){animation-delay:-.21s;background:#7bc8ff}.wave b:nth-child(3n){animation-delay:-.48s}
#deck.playing .wave b{animation-play-state:running}
@keyframes wave{to{height:7px}}
.console{position:absolute;bottom:3px;left:5px;right:5px;height:29px;display:flex;align-items:center;gap:6px;z-index:7;background:linear-gradient(180deg,#0d1023f5,#130d20fb);border-top:1px solid #ba67ff55;padding:0 4px;border-radius:0 0 6px 6px;box-shadow:0 -4px 12px #ae53ff15}
button{cursor:pointer;color:#fbe9ff;touch-action:manipulation}
.play{flex:0 0 25px;width:25px;height:25px;border-radius:7px;border:1px solid #f47cdb88;background:linear-gradient(145deg,#9a3aa7,#3e225f);box-shadow:0 0 8px #dd52de70,inset 0 0 7px #f2a6ff3c;display:grid;place-items:center;font-size:13px;line-height:1}
.play:hover{box-shadow:0 0 12px #f76bdf}
.middle{min-width:0;flex:1;height:26px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.meta{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:4px}
.title{font-size:10px;font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 5px #ce6bff6e}
.time{font-size:8px;white-space:nowrap;color:#d0bce5;font-variant-numeric:tabular-nums}
.sliders{display:flex;align-items:center;gap:6px;min-width:0}
input[type=range]{appearance:none;-webkit-appearance:none;outline:none;border:0;cursor:pointer;margin:0;touch-action:pan-x}
.seek{height:4px;min-width:20px;width:100%;flex:1;border-radius:10px;background:linear-gradient(90deg,#ff62c3 0%,#987bff var(--progress,0%),#403453 var(--progress,0%));box-shadow:0 0 6px #b34bed3c}
.volume{height:4px;min-width:0;flex:1;border-radius:10px;background:linear-gradient(90deg,#ff62c3 0%,#987bff var(--vol,45%),#403453 var(--vol,45%))}
.seek::-webkit-slider-thumb,.volume::-webkit-slider-thumb{appearance:none;background:#fff5ff;border:0;border-radius:50%;height:7px;width:7px;box-shadow:0 0 5px #ff7ff0}
.seek::-moz-range-thumb,.volume::-moz-range-thumb{background:#fff5ff;border:0;border-radius:50%;height:7px;width:7px;box-shadow:0 0 5px #ff7ff0}
.volume-wrap{display:flex;align-items:center;gap:3px;width:63px;flex:0 0 63px}
.volume-wrap svg{width:11px;height:11px;flex:none;color:#bdc6ff}
.loop{width:24px;height:24px;flex:0 0 24px;border-radius:6px;border:1px solid #a65ecb55;background:#261636;display:grid;place-items:center;font-size:20px;line-height:1;color:#8a759b}
.loop.on{color:#fac2ff;border-color:#ca76ff;box-shadow:inset 0 0 6px #dc73ff66,0 0 6px #d063ff50}
@media(max-width:280px){.portraits{width:220px}.character{width:40px}.character:nth-child(1),.character:nth-child(5){width:33px}.character:nth-child(3){width:50px}.hud-left,.hud-right{display:none}.console{gap:4px}.volume-wrap{width:48px;flex-basis:48px}.time{font-size:7px}}
@media(prefers-reduced-motion:reduce){#deck:before,.edge,.character,.beam,.wave b{animation-duration:15s}}
</style></head><body>
<div id="deck" role="group" aria-label="Lecteur audio Obsidia Nothing to me">
 <div class="edge"></div><div class="edge bottom-edge"></div>
 <div class="scene"><div class="city"></div><div class="hud-left">OBSIDIA<i></i></div><div class="hud-right">2654<i></i></div>
 <div class="portraits"><div class="character" title="Aren"><img src="aren.webp" alt="Aren"></div><div class="character" title="Nox"><img src="nox.webp" alt="Nox"></div><div class="character" title="Eiko"><img src="eiko.webp" alt="Eiko"></div><div class="character" title="Void"><img src="void.webp" alt="Void"></div><div class="character" title="Carol"><img src="carol.webp" alt="Carol"></div></div>
 <div class="beam"></div><div class="wave" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div></div>
 <div class="console"><button class="play" id="play" aria-label="Lecture">▶</button><div class="middle"><div class="meta"><span class="title">Elsewhere</span><span class="time" id="time">0:00 / 0:00</span></div><div class="sliders"><input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Position dans la musique"><div class="volume-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5a10 10 0 0 1 0 14"/></svg><input class="volume" id="volume" type="range" min="0" max="100" value="45" aria-label="Volume sonore"></div></div></div><button class="loop on" id="loop" aria-label="Lecture en boucle activée" aria-pressed="true">↻</button></div>
 <audio id="audio" preload="metadata" loop src="elsewhere.mp3"></audio>
</div>
<script>
(()=>{
const player=document.getElementById('deck'),audio=document.getElementById('audio'),play=document.getElementById('play'),loop=document.getElementById('loop'),seek=document.getElementById('seek'),volume=document.getElementById('volume'),time=document.getElementById('time');
const playerId=document.documentElement.dataset.track||'elsewhere';
function changeVolume(){const v=Number(volume.value);audio.volume=v/100;volume.style.setProperty('--vol',v+'%');volume.setAttribute('aria-valuetext',v+' pour cent')}
volume.oninput=changeVolume;changeVolume();audio.loop=true;
let channel=null;try{channel=new BroadcastChannel('obsidia-music-exclusive-v1');channel.onmessage=e=>{const m=e.data;if(m&&m.type==='obsidia-play'&&m.player!==playerId&&!audio.paused)audio.pause()}}catch(e){}
window.addEventListener('storage',e=>{if(e.key==='obsidia-current-track'&&e.newValue&&e.newValue!==playerId&&!audio.paused)audio.pause()});
function announce(){channel?.postMessage({type:'obsidia-play',player:playerId});try{localStorage.setItem('obsidia-current-track',playerId)}catch(e){}}
const fmt=s=>Number.isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
function update(){const dur=Number.isFinite(audio.duration)?audio.duration:0;seek.value=dur?Math.round(audio.currentTime/dur*1000):0;seek.style.setProperty('--progress',seek.value/10+'%');time.textContent=fmt(audio.currentTime)+' / '+fmt(dur)}
play.onclick=async()=>{if(audio.paused){try{await audio.play()}catch(e){console.error('Lecture impossible',e)}}else audio.pause()};
audio.onplay=()=>{announce();player.classList.add('playing');play.textContent='Ⅱ';play.setAttribute('aria-label','Pause')};
audio.onpause=()=>{player.classList.remove('playing');play.textContent='▶';play.setAttribute('aria-label','Lecture')};
audio.ontimeupdate=audio.onloadedmetadata=update;
loop.onclick=()=>{audio.loop=!audio.loop;loop.classList.toggle('on',audio.loop);loop.setAttribute('aria-pressed',String(audio.loop));loop.setAttribute('aria-label',audio.loop?'Lecture en boucle activée':'Lecture en boucle désactivée')};
seek.oninput=()=>{if(Number.isFinite(audio.duration)) audio.currentTime=Number(seek.value)/1000*audio.duration;update()};update();
})();
</script></body></html>
